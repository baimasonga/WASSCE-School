<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher dashboard · WASSCE Virtual Chemistry Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/lab.css">
<style>
.tw{max-width:1200px;margin:0 auto;padding:16px}
.tgrid{display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:start}
@media(max-width:820px){.tgrid{grid-template-columns:1fr}}
.cls{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;font-family:var(--f-body);padding:10px 12px;margin-bottom:8px;cursor:pointer}
.cls.on{border-color:var(--accent);background:var(--accent-soft)}
.cls b{display:block}.cls span{font-size:12px;color:var(--muted)}
.codebig{font-family:var(--f-mono);font-size:30px;font-weight:600;letter-spacing:5px;background:var(--navy);color:#7cc4ff;border-radius:12px;padding:8px 18px;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--soft);border:0;border-radius:12px;padding:12px 14px}.kpi b{font:700 26px/1.1 var(--f-head);display:block;color:var(--navy)}.kpi span{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding:6px 0;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:linear-gradient(180deg,#3b9cf0,var(--accent));border-radius:4px 4px 0 0;position:relative;min-height:2px}.bars div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px}
.blab{display:flex;gap:6px}.blab span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.auth{max-width:440px;margin:40px auto}
.auth input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin:4px 0 10px}
.clickrow{cursor:pointer}.clickrow:hover td{background:var(--soft)}
</style>
</head>
<body>
<nav class="school-return" aria-label="WASSCE School navigation"><a href="/?subject=chemistry&amp;view=Topics" target="_top">← WASSCE School · Chemistry</a><span>Virtual practical learning</span></nav>
<header class="top"><div class="brand"><span class="elem" aria-hidden="true"><svg viewBox="0 0 32 32" width="22" height="22"><path d="M12 4h8M13.5 4v8L6.5 25a2.4 2.4 0 0 0 2.1 3.5h14.8a2.4 2.4 0 0 0 2.1-3.5L18.5 12V4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.6 19.5h12.8l3.1 5.9a1.4 1.4 0 0 1-1.2 2.1H7.7a1.4 1.4 0 0 1-1.2-2.1z" fill="#5CC8FF"/><circle cx="14" cy="23" r="1.3" fill="#fff" opacity=".8"/><circle cx="18.5" cy="21.5" r=".9" fill="#fff" opacity=".7"/></svg></span><h1>Teacher dashboard<span>WASSCE Chemistry Lab</span></h1></div><span class="sp"></span><a class="btn sm" href="index.html" style="text-decoration:none">Open the lab</a><button class="btn sm" id="tout" hidden>Sign out</button></header>
<div class="tw" id="app"><div class="sub">Loading…</div></div>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script>
// minimal stubs so the mission list can be read without the lab runtime
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const UNKNOWN={};
</script>
<script src="js/scenarios.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/teacher.js"></script>
</body>
</html>
