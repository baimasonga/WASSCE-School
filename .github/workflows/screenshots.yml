name: Android screenshots
# Run from the Actions tab to render the main screens (docs/screenshots) and download them as an artifact.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Render screenshots
        # Google's mirror of Maven Central avoids Central's per-IP limit on Robolectric's large runtime jars.
        run: gradle testDebugUnitTest -Pscreenshots -ProbolectricRepo=https://maven-central.storage-download.googleapis.com/maven2 --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WASSCE-School-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
