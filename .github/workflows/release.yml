name: Android release
# Builds a signed APK and publishes it as a GitHub release tagged v<versionName> (from app/build.gradle.kts).
# Run it from the Actions tab (Run workflow) after bumping versionCode/versionName on main.
# The website links to releases/latest/download/WASSCE-School.apk, so the newest release is always served.
#
# Needs four repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   the release keystore (.p12), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# Every release must be signed with this same key, or Android refuses to install it as an update.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          name=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          code=$(sed -nE 's/^\s*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)
          test -n "$name" && test -n "$code" || { echo "::error::Could not read versionName/versionCode"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$name" >/dev/null; then
            echo "::error::Release v$name already exists. Bump versionCode and versionName in app/build.gradle.kts first."; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"; echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS KSP KA KP; do test -n "${!v}" || { echo "::error::Missing signing secret ($v). See the comment at the top of release.yml."; exit 1; }; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate content
        run: |
          python3 scripts/validate_bank.py
          python3 scripts/validate_lab.py
      - name: Test and build signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          gradle testReleaseUnitTest assembleRelease --stacktrace
          rm -f "$ANDROID_KEYSTORE_PATH"
      - name: Verify signature and package
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -1
          mkdir dist
          cp "$apk" dist/WASSCE-School.apk
          cp "$apk" "dist/WASSCE-School-${{ steps.version.outputs.name }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          cat > notes.md <<EOF
          WASSCE School for Android, version $VERSION.

          **Install:** download \`WASSCE-School.apk\` on an Android 8.0+ phone, open it, and allow installs from your browser when asked.
          Later versions install over this one and keep your progress. If you installed an earlier *test* build, uninstall it first.

          Original practice material, not official WAEC questions. See the README for what's new.
          EOF
          gh release create "v$VERSION" dist/WASSCE-School.apk "dist/WASSCE-School-$VERSION.apk" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "WASSCE School $VERSION" --notes-file notes.md --latest
